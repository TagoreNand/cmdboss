[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI dependency-injection idiom relies on calls in defaults
    "E501",  # long lines (docstrings/examples) are acceptable here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.coverage.run]
source = ["cmdboss"]
omit = ["cmdboss/main.py"]
